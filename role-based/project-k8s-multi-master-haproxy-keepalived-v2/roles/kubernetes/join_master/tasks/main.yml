---
- name: Check if master already joined cluster
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf_check

- name: Join master to Kubernetes cluster
  command: "{{ master_join_command }}"
  when: not admin_conf_check.stat.exists

- name: Create .kube directory for master user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to master user kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'