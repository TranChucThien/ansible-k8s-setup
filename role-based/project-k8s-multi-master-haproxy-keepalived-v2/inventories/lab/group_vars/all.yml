---
# Global variables for all hosts
kubernetes_version: "1.33"
kubernetes_upgrade_version: "1.34"
kubernetes_target_version: "v1.34.3"
kubernetes_package_version: "1.34.*"
pod_network_cidr: "10.10.0.0/16"
container_runtime: containerd
calico_version: "v3.28.0"

# HAProxy/Keepalived Configuration
vip_address: "192.168.10.100"
vip_netmask: "24"
virtual_router_id: "51"
keepalived_auth_enabled: true
# keepalived_password: "123456"
haproxy_cfg_path: /etc/haproxy/haproxy.cfg
haproxy_backup_path: /etc/haproxy/haproxy.cfg.backup

# API Server Configuration
api_server_address: "{{ vip_address }}"
api_server_port: "6443"

# Common SSH settings
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

# Global ETCD Backup Configuration
# Override these values per environment (dev/staging/prod)

# Remote backup directory on master nodes
etcd_backup_dir: "/opt/etcd-backup"

# Backup retention policy (days)
etcd_backup_retention_days: 7

# Local backup storage on control host
# Use absolute path for production environments
local_backup_dir: "./backups"

# Backup schedule for cron jobs
backup_cron_minute: "0"
backup_cron_hour: "2"
backup_cron_day: "*"
backup_cron_month: "*"
backup_cron_weekday: "*"