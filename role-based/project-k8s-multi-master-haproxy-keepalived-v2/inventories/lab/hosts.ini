# Inventory Groups Use Cases
# 
# [k8s_masters] - Initial master nodes that form the cluster
#   - First master (index 0) initializes the cluster
#   - Additional masters join using certificate-key
#   - Used for: cluster init, etcd backup, join command generation
#
# [k8s_new_masters] - New master nodes to be added to existing cluster
#   - Used for scaling operations
#   - Automatically joins existing cluster
#   - Move to k8s_masters group after successful join
#
# [k8s_workers] - Initial worker nodes
#   - Joins cluster using worker join token
#   - Runs application workloads
#
# [k8s_new_workers] - New worker nodes to be added
#   - Used for scaling operations
#   - Move to k8s_workers group after successful join
#
# [ha] - HAProxy + Keepalived nodes for load balancing
#   - Provides VIP failover for Kubernetes API
#   - First node becomes MASTER, others are BACKUP
#   - Should be separate from k8s nodes for true HA
#
# [k8s_cluster] - Parent group containing all Kubernetes nodes
#   - Used for cluster-wide operations (reset, common setup)
#
# [new_cluster] - Single master node for disaster recovery
#   - Used for etcd restore and cluster reinit scenarios
#   - Should contain only one master node
#   - Used with etcd/restore role

[k8s_masters]
k8s-master-1 ansible_host=192.168.10.138

[k8s_new_masters]
; k8s-master-2 ansible_host=192.168.10.139
; k8s-master-3 ansible_host=192.168.10.140

[k8s_workers]
k8s-worker-1 ansible_host=192.168.10.142

[k8s_new_workers]
; k8s-worker-2 ansible_host=192.168.10.144

[ha]
192.168.10.141
192.168.10.143

[new_cluster]
k8s-master-1 ansible_host=192.168.10.138

[k8s_cluster:children]
k8s_masters
k8s_workers
k8s_new_workers
k8s_new_masters

